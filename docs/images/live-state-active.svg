<svg xmlns="http://www.w3.org/2000/svg" class="orchgraph-svg" role="img" data-graph-id="live-review-flow" width="496" height="336" viewBox="0 0 62 42"><title>Live: evidence path active</title><style>.orchgraph-svg { background: #0d1117; color: #e6edf3; }
.orchgraph-edge { fill: none; stroke: #6e7681; stroke-width: .18; }
.orchgraph-edge.is-active { stroke: #22d3ee; stroke-width: .34; }
.orchgraph-edge.is-dashed { stroke-dasharray: .55 .4; }
.orchgraph-edge-label { fill: #8b949e; font: 1.1px ui-monospace, monospace; text-anchor: middle; }
.orchgraph-node rect { fill: #161b22; stroke: #6e7681; stroke-width: .18; }
.orchgraph-node-label { fill: #e6edf3; font: 1.25px ui-monospace, monospace; font-weight: 600; text-anchor: middle; }
.orchgraph-node-detail { fill: #8b949e; font: 1px ui-monospace, monospace; text-anchor: middle; }
.orchgraph-node-state { fill: #8b949e; font: 1.4px ui-monospace, monospace; font-weight: 700; }
.orchgraph-node.state-running .orchgraph-node-state, .orchgraph-node.state-blocked .orchgraph-node-state { fill: #d29922; }
.orchgraph-node.state-succeeded .orchgraph-node-state { fill: #3fb950; }
.orchgraph-node.state-failed .orchgraph-node-state { fill: #f85149; }
.orchgraph-node.state-queued .orchgraph-node-state { fill: #58a6ff; }
.orchgraph-node.state-running rect { stroke: #d29922; }
.orchgraph-node.state-blocked rect { stroke: #d29922; }
.orchgraph-node.state-succeeded rect { stroke: #3fb950; }
.orchgraph-node.state-failed rect { stroke: #f85149; }
.orchgraph-node.state-queued rect { stroke: #58a6ff; }</style><defs><marker id="live-review-flow-arrow" markerWidth="1.4" markerHeight="1.4" refX="1.1" refY=".7" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M0,0 L1.4,.7 L0,1.4 z" fill="context-stroke" /></marker></defs><g class="orchgraph-edges"><polyline class="orchgraph-edge kind-delegation is-active" data-edge-id="delegate-research" data-active="true" data-kind="delegation" points="24,7 24,10 45,10 45,19" marker-end="url(#live-review-flow-arrow)" /><text class="orchgraph-edge-label" x="53.5" y="14">delegates</text><polyline class="orchgraph-edge kind-delegation" data-edge-id="delegate-draft" data-active="false" data-kind="delegation" points="16,7 16,19" marker-end="url(#live-review-flow-arrow)" /><text class="orchgraph-edge-label" x="8.5" y="14">delegates</text><polyline class="orchgraph-edge kind-result is-active" data-edge-id="return-evidence" data-active="true" data-kind="result" points="45,23 45,32 23,32 23,35" marker-end="url(#live-review-flow-arrow)" /><text class="orchgraph-edge-label" x="53" y="29">evidence</text><polyline class="orchgraph-edge kind-verification is-dashed" data-edge-id="request-verification" data-active="false" data-kind="verification" points="16,23 16,35" marker-end="url(#live-review-flow-arrow)" /><text class="orchgraph-edge-label" x="10.5" y="29">draft</text></g><g class="orchgraph-nodes"><g class="orchgraph-node state-succeeded" role="img" aria-label="Review lead, succeeded" data-node-id="lead" data-state="succeeded"><rect x="8" y="3" width="23" height="4" rx=".45" /><text class="orchgraph-node-state" aria-hidden="true" x="9" y="4.8">✓</text><text class="orchgraph-node-label" x="19.5" y="4.775"><tspan x="19.5">Review lead</tspan></text><text class="orchgraph-node-detail" x="19.5" y="6.025"><tspan x="19.5">plans and delegates</tspan></text></g><g class="orchgraph-node state-succeeded" role="img" aria-label="Evidence agent, succeeded" data-node-id="research" data-state="succeeded"><rect x="35" y="19" width="20" height="4" rx=".45" /><text class="orchgraph-node-state" aria-hidden="true" x="36" y="20.8">✓</text><text class="orchgraph-node-label" x="45" y="20.775"><tspan x="45">Evidence agent</tspan></text><text class="orchgraph-node-detail" x="45" y="22.025"><tspan x="45">collects sources</tspan></text></g><g class="orchgraph-node state-queued" role="img" aria-label="Draft agent, queued" data-node-id="writer" data-state="queued"><rect x="4" y="19" width="25" height="4" rx=".45" /><text class="orchgraph-node-state" aria-hidden="true" x="5" y="20.8">◌</text><text class="orchgraph-node-label" x="16.5" y="20.775"><tspan x="16.5">Draft agent</tspan></text><text class="orchgraph-node-detail" x="16.5" y="22.025"><tspan x="16.5">waiting to synthesize</tspan></text></g><g class="orchgraph-node state-running" role="img" aria-label="Verifier, running" data-node-id="verify" data-state="running"><rect x="9" y="35" width="21" height="4" rx=".45" /><text class="orchgraph-node-state" aria-hidden="true" x="10" y="36.8">●</text><text class="orchgraph-node-label" x="19.5" y="36.775"><tspan x="19.5">Verifier</tspan></text><text class="orchgraph-node-detail" x="19.5" y="38.025"><tspan x="19.5">checking evidence</tspan></text></g></g></svg>